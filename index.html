<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aarria Bike Taxi</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Aarria Bike Taxi</h1>
            <p>गाँव / जगह चुने • सस्ती दरें</p>
        </header>

        <!-- Search -->
        <input type="text" id="searchInput" placeholder="🔍 गाँव, Hospital, College, Office खोजें..." />

        <!-- Villages Grid -->
        <div id="villageGrid"></div>

        <hr />

        <!-- Pickup with Search -->
        <label>Pickup</label>
        <div class="search-select">
            <input type="text" id="pickupSearch" placeholder="🔍 🔵 🔴 🔵 🔶 🔷 🔸 🔺 🔻" onkeyup="filterPickup()" />
            <select id="pickup" size="5">
                <option value="">--</option>
            </select>
        </div>

        <!-- Drop with Search -->
        <label>Drop</label>
        <div class="search-select">
            <input type="text" id="dropSearch" placeholder="Drop जोड़ें..." onkeyup="filterDrop()" />
            <select id="drop" size="5">
                <option value="">--</option>
            </select>
        </div>

        <!-- Distance -->
        <label>दूरी (किमी) <span style="color: red;">*</span></label>
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="number" id="distanceInput" placeholder="Auto या Manual" min="0" step="0.5" style="flex: 1;" />
            <button id="calcDistBtn" class="btn-small" style="padding: 10px 16px; background: #ff6f00; color: #fff; border: 0; border-radius: 8px; cursor: pointer;">Auto</button>
        </div>
        <div id="distStatus" style="font-size:12px;color:#888;margin-top:4px;"></div>

        <!-- Vehicle -->
        <label>Vehicle</label>
        <div class="vehicle-options">
            <button id="vBike" class="active" onclick="selectVeh('bike')">
                Bike<br />
                <small>₹8-15/km</small>
            </button>
            <button id="vAuto" onclick="selectVeh('auto')">
                Auto<br />
                <small>₹20-35/km</small>
            </button>
            <button id="vEri" onclick="selectVeh('erickshaw')">
                Erickshaw<br />
                <small>₹18-30/km</small>
            </button>
        </div>

        <!-- Fare -->
        <div class="box" style="background:#aafff2;">
            <div class="label">किराया</div>
            <div class="big" id="fareDisplay">₹0</div>
            <div id="fareInfo" style="font-size:12px;color:#888;">
                किराया की ऊर्जा बढ़ाने के लिए आपको ₹0 देगी।
            </div>
        </div>

        <button class="btn" id="bookBtn">Book Ride</button>
        <div id="bookMsg" class="msg"></div>

        <!-- MODAL -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2>Booking Details</h2>
                <div class="modal-grid">
                    <div class="item"></div>
                    <div class="item"></div>
                    <div class="item"></div>
                    <div class="item"></div>
                </div>

                <input type="tel" id="bPhone" placeholder="Phone Number *" maxlength="10" />
                <input type="text" id="bLandmark" placeholder="Landmark (στόχο, αριθμός)" />
                <input type="datetime-local" id="bTime" />

                <button class="btn btn-telegram" id="confirmBtn">Confirm Booking</button>
                <div id="modalMsg" class="msg"></div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
